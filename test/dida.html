    <script src="../dist/canvas.js"></script>
    <title>测试用例 | 滴答轮询动画</title>
    <style>
        body {

        #root {
            width: 90vw;

            border: 2px solid red;
        }

<body>
    <div id="root"></div>
    <script>

        Canvas.defineElement("demo", function (attr, deep) {
            // this.painter.strokeCircle(200, 200, 300 * (deep > 0.5 ? (1 - deep) : deep))
            this.painter.strokeCircle(200, 200, 300 * deep)
            console.log(this)
        }, {});

        let canvas = new Canvas({
            el: document.getElementById("root"),
            data: {},
            template: [{
                name: "demo",
                attr: {}
            }]
        })

        canvas.startDida(2000)

    </script>
