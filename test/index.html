<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../dist/canvas.js"></script>
    <title>测试用例</title>
    <style>
        body {
            margin: 0;
        }

        #root {
            width: 90vw;
            height: 90vh;
            border: 2px solid red;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script>
        let canvas = new Canvas({
            el: document.getElementById("root"),
            data: {
                radius: 100,
                color: "red",
                xs: [100, 200, 300]
            },
            template: [{
                for: _this => _this.data.xs,
                if: _this => _this.$index != 1,
                name: "circle",
                attr: {
                    type: "fill",
                    cx: _this => _this.$value,
                    // cx: _this => _this.width * 0.5,
                    cy: 300,
                    radius: _this => _this.data.radius * 0.5 * (_this.$index + 1)
                },
                config: {
                    // fillStyle: "blue" // _this => _this.data.color
                    fillStyle: _this => _this.$index == 0 ? "red" : "blue"
                },
                event: {
                    click(event) {
                        console.log(event)
                        this.setData({
                            radius: 50 + Math.random() * 300
                        })
                    }
                },
                children: []
            }]
        })

        setTimeout(function () {
            canvas.setData({
                radius: 100,
                color: "pink",
                xs: [60, 100, 400]
            })
        }, 1000)

    </script>
</body>

</html>
